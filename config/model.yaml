# Süper Lig Match Prediction & Simulation Model Configuration
# Single Source of Truth for Model Hyperparameters, Factors, and Backtesting

dixon_coles:
  half_life_years: 1.25
  season_carryover: 0.85
  in_season_boost: 1.50
  shot_alpha: 0.40
  ridge_att: 1.50
  ridge_def: 1.50
  squad_prior_weight: 0.18
  early_season_prior_weight: 0.15
  form_momentum_weight: 0.08
  low_tempo_damping_weight: 0.09          # Symmetric pace damping for sterile/low-tempo team matchups
  superiority_calibration_scale: 1.00     # Removed in-sample post-hoc multiplier; pure model unperturbed
  fixed_rho: null                         # Null fits rho directly from data via MLE (empirically -0.095)
  base_draw_inflation: 0.0                # Structural baseline (0.0 means unperturbed MLE)
  closeness_draw_threshold: 0.0           # Disabled ad-hoc inflation in favor of empirical rho
  closeness_draw_boost: 0.0
  refit_interval: 1
  integrate_uncertainty: true
  grid_size: 10

side_markets:
  corners_half_life: 0.75
  corners_shrinkage_k: 6.0
  cards_half_life: 0.75
  cards_shrinkage_k: 6.0
  in_season_boost: 3.0

market_blend:
  w_total: 0.25                           # Single source of truth for market odds blending
  w_superiority: 0.12                     # Overriding in audit is strictly forbidden
  shin_max_iter: 100

referee:
  enabled: false                          # Only 38 matches in 26/27; disabled until multi-season verified
  shrinkage_k: 6.0
  tempo_to_lambda_coef: 0.04
  whistle_to_tempo_slope: 0.035

external_factors:
  weather_enabled: false                  # Tested: 0 gain on holdout -> Disabled
  euro_fatigue_enabled: false             # Insufficient historical data -> Disabled by default
  venue_edge_enabled: false               # Tested: no detectable gain (p=0.366) -> Disabled by default
  availability_enabled: false             # No historical snapshot coverage -> Disabled by default

availability:
  max_single_player_lambda_shift: 0.05    # Bounded until full out-of-sample forward verification
  max_team_lambda_shift: 0.20             # Cap on net team attack/defense shift
  doubtful_p_play: 0.50                   # Expected value probability for 'doubtful' status
  prior_weight_minutes: 0.85              # Weight assigned to typical XI baseline

calibration:
  temperature_enabled: true               # Faz 4.1 proven: T≈0.75 reduces favorite underconfidence, delta RPS -0.0015 (p=4.5e-7)
  default_temperature: 0.75
  temperature_floor: 0.60
  temperature_ceil: 1.05

backtest:
  train_seasons:
    - "2122"
    - "2223"
    - "2324"
    - "2425"
  val_season: "2526"
  test_season: "2627"
  burn_in_matches: 300
  refit_interval: 10
