# Süper Lig Match Prediction & Simulation Model Configuration
# Single Source of Truth for Model Hyperparameters, Factors, and Backtesting

dixon_coles:
  half_life_years: 1.25
  in_season_boost: 3.5
  squad_prior_weight: 0.18
  refit_interval: 1
  integrate_uncertainty: true
  grid_size: 10

side_markets:
  corners_half_life: 0.75
  corners_shrinkage_k: 6.0
  cards_half_life: 0.75
  cards_shrinkage_k: 6.0
  in_season_boost: 3.0

market_blend:
  w_total: 0.25
  w_superiority: 0.12
  shin_max_iter: 100

referee:
  enabled: true
  shrinkage_k: 6.0
  tempo_to_lambda_coef: 0.04
  whistle_to_tempo_slope: 0.035

external_factors:
  weather_enabled: false         # Out-of-sample holdout must prove value before enabling by default
  euro_fatigue_enabled: true     # Congested schedule / European travel fatigue
  venue_edge_enabled: true       # Team-specific home advantage variation
  availability_enabled: true     # Player availability / injury / suspension shifts

availability:
  max_single_player_lambda_shift: 0.05   # Bounded until full out-of-sample forward verification
  max_team_lambda_shift: 0.20           # Cap on net team attack/defense shift
  doubtful_p_play: 0.50                 # Expected value probability for 'doubtful' status
  prior_weight_minutes: 0.85            # Weight assigned to typical XI baseline

backtest:
  train_seasons:
    - "2122"
    - "2223"
    - "2324"
    - "2425"
  val_season: "2526"
  test_season: "2627"
  burn_in_matches: 300
  refit_interval: 10
